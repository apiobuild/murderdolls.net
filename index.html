<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MURDERDOLLS</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { min-height:100%; }
  body {
    background:#0b0b0b url(assets/pattern.webp) center top / 1400px auto repeat;
    display:flex; justify-content:center; align-items:center; min-height:100vh;
    padding:24px 0;
  }
  .frame {
    width:min(1080px, 100% - 32px); background:#000;
    height:calc(100vh - 48px); height:calc(100svh - 48px);
    box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.8);
    display:grid; grid-template-rows:auto minmax(0, 1fr) auto;
  }
  header {
    position:relative; height:84px; background:#0a0a0a;
    border-bottom:2px solid #b30000;
    display:flex; align-items:center; justify-content:flex-end; padding:0 36px;
  }
  .logo { position:absolute; left:56px; top:-6px; z-index:2; line-height:0; }
  .logo img {
    width:170px; height:auto;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.9));
  }
  nav ul { list-style:none; display:flex; gap:34px; }
  nav a {
    font-family:'Oswald',sans-serif; font-weight:600; font-size:.95rem;
    letter-spacing:.06em; text-transform:uppercase; color:#d8d4cf; text-decoration:none;
    display:inline-flex; align-items:center; gap:5px; transition:color .2s;
  }
  nav a:hover { color:#e01010; }
  nav svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.4; }
  .hero-picture { min-height:0; min-width:0; }
  .hero { display:block; width:100%; height:100%; min-height:0; min-width:0; object-fit:cover; }
  footer {
    border-top:2px solid #b30000; background:#0a0a0a;
    display:flex; justify-content:center; padding:18px 16px;
  }
  .socials { display:flex; gap:16px; }
  .socials a { display:grid; place-items:center; width:34px; height:34px; transition:transform .2s; }
  .socials a:hover { transform:translateY(-2px); }
  .socials svg { width:22px; height:22px; fill:#e8e6e3; transition:fill .2s; }
  .socials a:hover svg { fill:#e01010; }

  @media (max-width:760px) {
    body { padding:0; align-items:flex-start; }
    .frame { width:100%; height:100vh; height:100svh; }
    header { height:auto; flex-direction:column; align-items:center; padding:12px 16px 14px; }
    .logo { position:static; margin-bottom:8px; }
    .logo img { width:180px; }
    nav ul { gap:16px 20px; flex-wrap:wrap; justify-content:center; }
    nav a { font-size:.85rem; }
  }
</style>
</head>
